[project]
name = "snced"
version = "0.1.0"
description = "SN-CED: Semantic Note Memory for Causal Encoder-Decoder LLMs (research prototype)"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy", "pyyaml", "psutil", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
